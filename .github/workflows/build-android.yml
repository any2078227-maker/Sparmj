name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Check project files
        run: |
          echo "Current folder:"
          pwd
          echo "Files:"
          ls -la
          echo "WWW folder:"
          ls -la www
          test -f www/index.html

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.lifeos.app",
            "appName": "LifeOS",
            "webDir": "www"
          }
          EOF

      - name: Verify Capacitor config
        run: |
          cat capacitor.config.json
          test -f www/index.html

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Create Android project
        run: |
          npx cap add android

      - name: Copy web files to Android
        run: |
          npx cap copy android
          npx cap sync android

      - name: Verify Android HTML
        run: |
          echo "Checking Android HTML..."
          test -f android/app/src/main/assets/public/index.html
          echo "Android index.html FOUND"
          wc -c android/app/src/main/assets/public/index.html
          head -c 500 android/app/src/main/assets/public/index.html
          echo

      - name: Add microphone permission
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          permission = '<uses-permission android:name="android.permission.RECORD_AUDIO" />'

          if "android.permission.RECORD_AUDIO" not in content:
              content = re.sub(
                  r'(<manifest\b[^>]*>)',
                  r'\1\n    ' + permission,
                  content,
                  count=1
              )

          manifest.write_text(content)
          print("Microphone permission added")
          PY

      - name: Fix Kotlin dependencies
        run: |
          cat >> android/build.gradle <<'EOF'

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          EOF

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
