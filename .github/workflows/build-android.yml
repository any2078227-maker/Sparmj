name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Check project files
        run: |
          pwd
          ls -la
          ls -la www
          test -f www/index.html

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.lifeos.app",
            "appName": "LifeOS",
            "webDir": "www"
          }
          EOF

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Create Android project
        run: |
          npx cap add android

      - name: Sync Web Files
        run: |
          npx cap copy android
          npx cap sync android

      - name: Add Storage Permissions
        run: |
          python - << 'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          permissions = """
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
          """

          if "READ_MEDIA_IMAGES" not in content:
              content = content.replace(
                  "<manifest",
                  permissions + "\n<manifest",
                  1
              )

          manifest.write_text(content)
          print("Storage permissions added")
          PY

      - name: Show Manifest
        run: |
          cat android/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
