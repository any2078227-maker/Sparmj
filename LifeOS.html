<head>

<title>My LifeOS</title>
<style>
:root{
 --bg:#f5f6f8;--surface:#fff;--surface2:#f8f9fb;--text:#1b2330;--muted:#707988;
 --line:#dfe3e9;--accent:#5d57c9;--accent2:#318fb8;--green:#16834b;--red:#c23a3a;
 --sidebar:#121822;--shadow:0 3px 14px rgba(22,31,45,.06);--r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;overflow-x:hidden}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:13px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit;max-width:100%}
button{cursor:pointer;touch-action:manipulation}
img,svg,video,canvas{max-width:100%;height:auto}
.app{display:grid;grid-template-columns:218px minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;overflow:auto;background:var(--sidebar);color:#fff;padding:10px;z-index:50}
.brand{display:flex;align-items:center;gap:8px;padding:5px 6px 10px;margin-bottom:7px;border-bottom:1px solid #293241}
.brand-logo{width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;border-radius:50%;background:#202a39;border:1px solid #5c5540;color:#f2cc68;font-size:23px}
.brand b{display:block;font-size:15px}.brand small{display:block;color:#9faaba;font-size:10px}
.sidebar-top-tools{display:flex;justify-content:flex-end}.sidebar-theme-toggle{width:32px;height:30px;border:1px solid #303b4d;border-radius:8px;background:#1b2432;color:#fff}
nav{display:grid;gap:2px}
nav button{width:100%;min-height:35px;padding:7px 9px;border:1px solid transparent;border-radius:8px;background:transparent;color:#bdc6d3;text-align:left;font-weight:650;font-size:11.5px;line-height:1.2}
nav button:hover{background:#1d2736;color:#fff}nav button.active{background:#302b55;border-color:#49427b;color:#fff}
.main{min-width:0;width:100%;padding:14px 16px 24px;overflow-x:hidden}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 13px;margin-bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.top h1{margin:0;font-size:22px;line-height:1.15}.sub{margin-top:2px;color:var(--muted);font-size:11px}.date-panel{display:flex;align-items:center;gap:7px;min-width:0}.date{width:145px!important;min-height:36px}
.section{display:none;min-width:0}.section.active{display:block}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:10px}.g3,.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.two{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:10px}
.card,.item,.routine,.note-card,.module-hero,.hero,.kpi-box,.focus-stat,.badge,.mentor-date-card,.mentor-quote-card{
 background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0
}
.card{padding:12px}.hero,.module-hero{padding:15px;margin-bottom:10px}.module-hero{background:linear-gradient(135deg,#2a2550,#355e78);color:#fff}
h2{font-size:16px;margin:0 0 9px;line-height:1.2}h3{font-size:14px;margin:0 0 7px}h4{font-size:13px;margin:0 0 5px}
p{margin:0 0 7px}.label{font-size:10px;color:var(--muted);font-weight:750}.muted,.meta{color:var(--muted)}.meta{font-size:10px}
.row,.between{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.form,.formgrid{display:grid;gap:7px}.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
input,textarea,select{width:100%;min-height:36px;padding:7px 9px;background:#fff;color:var(--text);border:1px solid var(--line);border-radius:8px;outline:0}
textarea{min-height:82px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:#7871d7;box-shadow:0 0 0 2px rgba(93,87,201,.1)}
.primary,.secondary,.danger{min-height:35px;padding:7px 10px;border-radius:8px;font-weight:700}.primary{border:1px solid #5650bd;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.secondary{border:1px solid var(--line);background:#f5f6fb;color:#4d46a5}.danger{border:1px solid #efcccc;background:#fff4f4;color:var(--red)}
.list{display:grid;gap:6px}.item{padding:9px}.title{font-weight:700}.tag,.pill,.chip{display:inline-block;padding:3px 6px;border-radius:999px;background:#eeefff;color:#4e47ac;font-size:9px;font-weight:750}
.progress{height:6px;background:#e8ebf0;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.kpi-box{padding:9px;background:var(--surface2);box-shadow:none}.metric,.money,.big{font-size:22px;font-weight:800;line-height:1.1}
.routine{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:7px;align-items:center;padding:9px;margin-bottom:6px}.time{font-weight:800;color:var(--accent)}.cat{font-size:9px;padding:3px 6px;border-radius:999px;background:#f0f1ff;color:#5149b8}
.routine-actions,.point-actions{display:flex;gap:5px}.point{display:flex;gap:7px;align-items:center;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--surface2)}
.point input{width:auto;min-height:17px}.point-text{flex:1;min-width:0}.point-done .point-text{text-decoration:line-through;opacity:.6}
.note-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,.8fr);gap:10px}.note-card{padding:10px;min-height:110px}.note-card img{max-width:100%;max-height:210px;object-fit:cover;border-radius:8px;margin-top:6px}
.photo-preview,.attachment-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.photo-preview img{width:70px;height:52px;object-fit:cover;border-radius:7px}.attachment-chip{display:inline-block;padding:5px 7px;border-radius:7px;background:#f1f3f6;font-size:10px}
.periods{display:flex;gap:5px;flex-wrap:wrap}.periods button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 9px}.periods button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.balance{padding:10px;border-radius:9px;background:var(--surface2)}.income{color:var(--green)}.expense{color:var(--red)}
.toast{position:fixed;right:12px;bottom:12px;display:none;z-index:5000;padding:9px 12px;background:#202633;color:#fff;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.mission-fields{display:grid;grid-template-columns:1.1fr .7fr 1.2fr .7fr 1fr;gap:6px}.mission-row{padding:7px;border:1px solid var(--line);border-radius:8px;margin-bottom:5px}.mission-row-title{margin-bottom:5px}
.mentor-quote-text{font-size:17px;line-height:1.5;margin:9px 0}.mentor-quote-form{display:grid;grid-template-columns:1.5fr .8fr .9fr auto;gap:6px}
.focus-shell{text-align:center}.focus-clock{font-size:48px;font-weight:850;letter-spacing:1px;margin:10px 0}.focus-presets{display:flex;justify-content:center;gap:5px;flex-wrap:wrap}.focus-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}.focus-stat{padding:9px;background:var(--surface2);box-shadow:none}
.badge-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.badge{padding:11px}.badge-icon{font-size:23px}.badge.locked{opacity:.55}
#bsCalendarModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:6000;padding:12px;align-items:center;justify-content:center}
#bsCalendarModal.open{display:flex}.bs-calendar-card{width:min(520px,100%);max-height:90dvh;overflow:auto;background:#fff;border-radius:12px;padding:12px}
.bs-calendar-top{display:flex;justify-content:space-between;align-items:center;gap:6px}.bs-calendar-title{text-align:center;display:grid;gap:1px}.bs-calendar-tools{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:7px 0}.bs-calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.bs-weekday{text-align:center;font-size:9px;color:#667085;padding:3px}.bs-day{min-height:47px;border:1px solid #e5e8ef;background:#fafbfe;border-radius:6px;padding:3px;font-size:9px}.bs-day.selected{border-color:var(--accent);background:#efedff}.bs-day.today{box-shadow:inset 0 0 0 2px #e8b94a}.bs-num{display:block;font-weight:800}.ad-num{display:block;color:#7b8494;font-size:8px;margin-top:1px}.bs-calendar-footer{display:flex;justify-content:space-between;align-items:center;margin-top:7px}
.mobile-bottom-nav{display:none}
@media(max-width:1050px){
 .app{display:block}.side{position:sticky;top:0;height:auto;padding:7px 8px;overflow:hidden}.brand{padding:2px 3px 6px;margin-bottom:5px}.brand-logo{width:34px;height:34px;flex-basis:34px;font-size:20px}.brand b{font-size:14px}
 .sidebar-top-tools{display:none}nav{display:flex;overflow-x:auto;gap:4px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}nav button{flex:0 0 auto;width:auto;min-height:32px;padding:6px 9px;border-radius:999px;font-size:10px;white-space:nowrap}
 .main{padding:9px 10px 76px}.top{padding:9px 11px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two,.three,.note-grid{grid-template-columns:1fr}
 .mobile-bottom-nav{position:fixed;left:7px;right:7px;bottom:7px;display:flex;z-index:1000;gap:2px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 7px 22px rgba(0,0,0,.16);backdrop-filter:blur(8px)}
 .mobile-bottom-nav button{flex:1;min-width:0;min-height:48px;border:0;background:transparent;color:var(--muted);border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:3px;font-size:8px;font-weight:800}
 .mobile-bottom-nav button.active{background:#eeecff;color:#4d46aa}.mobile-bottom-nav .mi{font-size:17px;line-height:1}.mobile-bottom-nav .bottom-theme{max-width:48px;border-left:1px solid var(--line)}
}
@media(max-width:700px){
 .main{padding:7px 7px 72px}.top{display:block;padding:10px;margin-bottom:8px}.top h1{font-size:19px}.top .date{width:100%!important;margin-top:6px}
 .grid,.formgrid,.kpi-grid,.badge-grid,.mentor-quote-form{grid-template-columns:1fr}.card{padding:10px;border-radius:10px}.hero,.module-hero{padding:12px}
 .metric,.money,.big{font-size:20px}.routine{grid-template-columns:47px minmax(0,1fr);gap:6px;padding:8px}.routine-actions{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr}.routine-actions button{width:100%}
 .mission-fields{grid-template-columns:1fr}.focus-clock{font-size:40px}.focus-stats{grid-template-columns:1fr}.mentor-quote-text{font-size:15px}.date-panel{display:block}
}
@media(max-width:380px){nav button{font-size:9px;padding:5px 8px}.mobile-bottom-nav button{font-size:7px}.mobile-bottom-nav .mi{font-size:16px}.main{padding-left:5px;padding-right:5px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
html[data-lifeos-mode="dark"]{--bg:#0b1018;--surface:#121923;--surface2:#18212d;--text:#edf1f7;--muted:#aab3c1;--line:#2b3544;--sidebar:#080d14}
html[data-lifeos-mode="dark"] input,html[data-lifeos-mode="dark"] textarea,html[data-lifeos-mode="dark"] select{background:#101720;color:#edf1f7;border-color:#354052}
html[data-lifeos-mode="dark"] .secondary{background:#1b213a;color:#ddd9ff;border-color:#3a456e}
html[data-lifeos-mode="dark"] .danger{background:#2a181b;color:#ffb4b4;border-color:#603036}
html[data-lifeos-mode="dark"] .mobile-bottom-nav{background:#121923;border-color:#303a49}

.voice-status{font-size:10px;color:var(--muted);margin-top:4px}
#voiceBtn:disabled{opacity:.65}
@media(max-width:1050px){

 .mobile-bottom-nav button{flex:1;min-width:0;min-height:48px;border:0;background:transparent;color:var(--muted);border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:3px;font-size:8px;font-weight:800}
 .mobile-bottom-nav button.active{background:#eeecff;color:#4d46aa}

@media(max-width:700px){

@media(max-width:430px){

</style>

<script>


const KEY='lifeos_clean_v5';
const LEGACY_KEYS=['lifeos_upgraded_v4','lifeos_upgraded_v4_drafts','lifeos_upgraded_v4_recovery'];
try{LEGACY_KEYS.forEach(k=>localStorage.removeItem(k));}catch(e){}
const LEGACY_ATTACH_DB='lifeos-attachments-v1';
const MAX_LOCAL_BYTES=4_500_000;
const ATTACH_DB='lifeos-attachments-v2';
const ATTACH_STORE='files';
let attachmentDBPromise=null;
try{if('indexedDB' in window)indexedDB.deleteDatabase(LEGACY_ATTACH_DB);}catch(e){}
const MAX_IMAGE_BYTES=900_000;
const MAX_IMAGE_SIDE=1600;

// Normalize/sanitize stored rich text from older versions before it is rendered.
function sanitizeRichHtml(html=''){
  const input=String(html||'');
  if(typeof DOMParser==='undefined') return esc(input.replace(/<[^>]*>/g,''));
  const doc=new DOMParser().parseFromString(input,'text/html');
  const allowed=new Set(['B','STRONG','I','EM','U','S','BR','P','DIV','SPAN','UL','OL','LI','BLOCKQUOTE']);
  doc.body.querySelectorAll('*').forEach(el=>{
    if(!allowed.has(el.tagName)){el.replaceWith(document.createTextNode(el.textContent||''));return}
    [...el.attributes].forEach(a=>{
      if(!['style'].includes(a.name.toLowerCase())) el.removeAttribute(a.name);
      else if(!/^(color|background-color|font-size|text-align|font-weight|font-style|text-decoration)\s*:/i.test(a.value)) el.removeAttribute(a.name);
    });
  });
  return doc.body.innerHTML;
}

async function compressImage(file){
  if(!file.type.startsWith('image/')) return null;
  if(!('createImageBitmap' in window) && !/image\/(jpeg|jpg|png|webp)$/i.test(file.type)) return null;
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=url});
    const scale=Math.min(1,MAX_IMAGE_SIDE/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));
    const c=document.createElement('canvas');c.width=Math.max(1,Math.round((img.naturalWidth||img.width)*scale));c.height=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));
    c.getContext('2d',{alpha:true}).drawImage(img,0,0,c.width,c.height);
    let q=.78, out=c.toDataURL('image/jpeg',q);
    while(out.length>MAX_IMAGE_BYTES*1.37 && q>.45){q-=.07;out=c.toDataURL('image/jpeg',q)}
    return out;
  }finally{URL.revokeObjectURL(url)}
}

async function ensureMicrophoneAccess(){
  if(!window.isSecureContext&&location.hostname!=='localhost'&&location.hostname!=='127.0.0.1')return{ok:false,reason:'secure'};
  if(!navigator.mediaDevices?.getUserMedia)return{ok:false,reason:'unsupported'};
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    stream.getTracks().forEach(t=>t.stop());
    return{ok:true};
  }catch(e){
    const n=e?.name||'';
    if(n==='NotAllowedError'||n==='PermissionDeniedError')return{ok:false,reason:'denied'};
    if(n==='NotFoundError')return{ok:false,reason:'missing'};
    return{ok:false,reason:'error'};
  }
}
function voicePermissionHelp(reason){
  const msg={
    secure:'Voice के लिए HTTPS या localhost पर app चलाएँ।',
    unsupported:'इस browser में microphone access उपलब्ध नहीं है। Latest Chrome/Edge इस्तेमाल करें।',
    denied:'Microphone blocked है। Address bar → Site settings → Microphone → Allow करें, फिर Voice दबाएँ।',
    missing:'Microphone उपलब्ध नहीं मिला। Device microphone check करें।',
    error:'Microphone access नहीं मिल पाया। Site permission check करके फिर कोशिश करें।'
  }[reason]||'Microphone access नहीं मिल पाया।';
  toast('🎙️ '+msg);
}
async function toggleVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('Voice-to-Text इस browser में उपलब्ध नहीं है। Latest Chrome/Edge इस्तेमाल करें।');return}
  if(listening){try{recognition?.stop()}catch(e){}return}
  const editor=document.getElementById('nb');
  if(!editor){toast('पहले Notes में नया/मौजूदा note खोलें');return}
  const btn=document.getElementById('voiceBtn');
  if(btn){btn.disabled=true;btn.textContent='🎙️ Checking Mic…'}
  const access=await ensureMicrophoneAccess();
  if(btn)btn.disabled=false;
  if(!access.ok){if(btn)btn.textContent='🎙️ Start Voice';voicePermissionHelp(access.reason);return}
  recognition=new SR();
  recognition.lang=document.getElementById('voiceLang')?.value||'hi-IN';
  recognition.continuous=false;recognition.interimResults=false;recognition.maxAlternatives=1;
  recognition.onstart=()=>{listening=true;const b=document.getElementById('voiceBtn');if(b)b.textContent='⏹️ Stop Voice';toast('🎙️ सुन रहा हूँ...')};
  recognition.onresult=e=>{
    const t=String(e.results?.[0]?.[0]?.transcript||'').trim();if(!t)return;
    const target=document.getElementById('nb');if(!target)return;target.focus();
    const sel=window.getSelection();let r;
    if(sel&&sel.rangeCount&&target.contains(sel.anchorNode))r=sel.getRangeAt(0).cloneRange();
    else{r=document.createRange();r.selectNodeContents(target);r.collapse(false)}
    r.deleteContents();const n=document.createTextNode((target.innerText?.trim()?' ':'')+t);
    r.insertNode(n);r.setStartAfter(n);r.collapse(true);
    if(sel){sel.removeAllRanges();sel.addRange(r)}
    target.dispatchEvent(new Event('input',{bubbles:true}));saveRichDraft();toast('Voice text added');
  };
  recognition.onerror=e=>{
    listening=false;const b=document.getElementById('voiceBtn');if(b)b.textContent='🎙️ Start Voice';
    if(e.error==='not-allowed'||e.error==='service-not-allowed')voicePermissionHelp('denied');
    else if(e.error==='audio-capture')voicePermissionHelp('missing');
    else if(e.error!=='aborted')toast('Voice error: '+e.error);
  };
  recognition.onend=()=>{listening=false;const b=document.getElementById('voiceBtn');if(b)b.textContent='🎙️ Start Voice'};
  try{recognition.start()}catch(e){listening=false;const b=document.getElementById('voiceBtn');if(b)b.textContent='🎙️ Start Voice';toast('Voice start नहीं हो पाया; फिर से कोशिश करें')}
}

function habitTimesFor(x){
  const count=Math.max(1,Math.min(99,Math.round(Number(x?.timesPerDay)||1)));
  let times=Array.isArray(x?.times)?x.times.map(v=>String(v||'').slice(0,5)):[];
  if(!times.length&&x?.time)times=[String(x.time).slice(0,5)];
  while(times.length<count)times.push('');
  return times.slice(0,count);
}
function habitCard(n,icon,custom){
  let x=data.habits.find(h=>h.date===today()&&h.name===n)||{done:false,time:'',timesPerDay:1,times:[]};
  let freq=Math.max(1,Math.min(99,Math.round(Number(x.timesPerDay)||1)));
  let times=habitTimesFor({...x,timesPerDay:freq});
  const encoded=encodeURIComponent(n);
  const timeRows=times.map((tm,i)=>`<div class="habit-time-row"><span class="habit-time-label">बार ${i+1} का समय</span><label class="habit-time"><input type="time" value="${esc(tm)}" onchange="setHabitOccurrenceTime('${encoded}',${i},this.value)" aria-label="${esc(n)} बार ${i+1} का समय"><span class="pill">⏰ Time</span></label></div>`).join('');
  return `<div class="card habit-card"><div class="between"><h2>${icon} ${esc(n)}</h2>${custom?`<button class="btn danger" onclick="deleteCustomHabit('${encoded}')">Delete</button>`:''}</div><div class="habit-controls"><label class="habit-frequency"><span>कितनी बार?</span><input type="number" min="1" max="99" step="1" value="${freq}" aria-label="${esc(n)} कितनी बार प्रति दिन" onchange="setHabitFrequency('${encoded}',this.value)"><span>बार / दिन</span></label></div><div class="habit-times">${timeRows}</div><label class="habit-complete"><input type="checkbox" ${x.done?'checked':''} onchange="setHabit('${encoded}',this.checked)" style="width:auto"> Today completed</label></div>`;
}
function ensureHabit(name){
  let x=data.habits.find(h=>h.date===today()&&h.name===name);
  if(!x){x={id:uid(),name,date:today(),done:false,time:'',timesPerDay:1,times:[''],custom:!defaultHabits.some(h=>h[0]===name)};data.habits.push(x)}
  x.timesPerDay=Math.max(1,Math.min(99,Math.round(Number(x.timesPerDay)||1)));
  x.times=habitTimesFor(x);
  x.time=x.times[0]||'';
  return x;
}

async function downloadBlob(content,type,filename){
  try{
    const blob=content instanceof Blob?content:new Blob([content],{type});
    const url=URL.createObjectURL(blob);
    const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent||'');
    if(mobile&&navigator.share&&navigator.canShare){
      const file=new File([blob],filename,{type:blob.type||type});
      if(navigator.canShare({files:[file]})){
        try{await navigator.share({title:'LifeOS Backup',text:filename,files:[file]});setTimeout(()=>URL.revokeObjectURL(url),3000);return true}
        catch(e){if(e?.name==='AbortError'){URL.revokeObjectURL(url);return false}}
      }
    }
    const a=document.createElement('a');a.href=url;a.download=filename;a.rel='noopener';
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);
    return true;
  }catch(e){toast('Export failed: '+(e?.message||e));return false}
}

function renderFocus(){const mins=Math.floor(focusRemaining/60),secs=focusRemaining%60;const totalSeconds=data.focusSessions.reduce((a,x)=>a+Number(x.seconds||Number(x.minutes||0)*60),0);const total=Math.floor(totalSeconds/60);document.getElementById('focus').innerHTML=`<div class="card focus-shell"><div class="eyebrow">FOCUS MODE</div><h2>Deep work, one session at a time</h2><div class="focus-clock">${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}</div><div class="focus-presets">${[25,50,90].map(m=>`<button class="secondary ${focusModeSeconds===m*60?'active':''}" onclick="setFocus(${m})">${m} min</button>`).join('')}</div><div class="focus-custom" style="margin:16px auto 0;max-width:420px"><div class="row" style="justify-content:center;gap:8px"><label style="display:flex;flex-direction:column;gap:5px;text-align:left;font-size:12px"><span>Minutes</span><input id="focusMinutes" type="number" min="0" max="180" step="1" value="${Math.floor(focusModeSeconds/60)}" style="width:110px"></label><label style="display:flex;flex-direction:column;gap:5px;text-align:left;font-size:12px"><span>Seconds</span><input id="focusSeconds" type="number" min="0" max="59" step="1" value="${focusModeSeconds%60}" style="width:110px"></label><button class="secondary" onclick="applyFocusCustom()" style="margin-top:18px">Set Time</button></div><div class="meta" style="margin-top:7px">Apna exact focus time set kar sakte ho — minutes + seconds.</div></div><div class="row" style="justify-content:center;margin-top:15px"><button class="primary" onclick="toggleFocus()">${focusTimer?'Pause':'Start Focus'}</button><button class="secondary" onclick="resetFocus()">Reset</button></div><div class="focus-stats"><div class="focus-stat"><b>${total}</b><br><span class="meta">Minutes focused</span></div><div class="focus-stat"><b>${data.focusSessions.length}</b><br><span class="meta">Sessions</span></div><div class="focus-stat"><b>${data.focusSessions.filter(x=>x.date===today()).length}</b><br><span class="meta">Today</span></div></div></div><div class="card" style="margin-top:16px"><h2>Recent Focus Sessions</h2><div class="list">${data.focusSessions.slice(-10).reverse().map(x=>{const ss=Number(x.seconds||Number(x.minutes||0)*60);const mm=Math.floor(ss/60),rs=ss%60;return `<div class="item"><b>${mm} min ${String(rs).padStart(2,'0')} sec</b><div class="meta">${esc(x.date||'')} · ${esc(x.label||'Focus session')}</div></div>`}).join('')||'<div class="empty">अभी कोई session नहीं।</div>'}</div></div>`}
function setFocus(m){if(focusTimer)return;focusMode=m;focusModeSeconds=m*60;focusRemaining=focusModeSeconds;renderFocus()}
function applyFocusCustom(){if(focusTimer)return;const m=Math.max(0,Math.min(180,Number(document.getElementById('focusMinutes')?.value)||0));const s=Math.max(0,Math.min(59,Number(document.getElementById('focusSeconds')?.value)||0));const total=m*60+s;if(total<1){toast('⏱️ Kam se kam 1 second set karo');return}focusModeSeconds=total;focusMode=Math.floor(total/60);focusRemaining=total;renderFocus()}
function toggleFocus(){
  if(focusTimer){clearInterval(focusTimer);focusTimer=null;renderFocus();return}
  if(focusRemaining<1)focusRemaining=focusModeSeconds;
  let endAt=Date.now()+focusRemaining*1000;
  const tick=()=>{
    focusRemaining=Math.max(0,Math.ceil((endAt-Date.now())/1000));
    const clock=document.querySelector('#focus .focus-clock');
    if(clock){const mins=Math.floor(focusRemaining/60),secs=focusRemaining%60;clock.textContent=String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0');}
    if(focusRemaining<=0){
      clearInterval(focusTimer);focusTimer=null;
      const sessionSeconds=focusModeSeconds;
      data.focusSessions.push({id:uid(),minutes:Math.floor(sessionSeconds/60),seconds:sessionSeconds,date:today(),label:'Focus session'});
      save();toast('🎯 Focus session complete');focusRemaining=focusModeSeconds;renderFocus();
    }
  };
  focusTimer=setInterval(tick,1000);
  renderFocus();
}
function resetFocus(){if(focusTimer){clearInterval(focusTimer);focusTimer=null}focusRemaining=focusModeSeconds;renderFocus()}

function mentorFinance(){
 const m=data.mentor,start=m.startDate||today(),cap=Math.max(0,Number(m.startingCapital||0));
 const income=(data.income||[]).filter(x=>x.date>=start).reduce((a,x)=>a+Number(x.amount||0),0);
 const expense=(data.expenses||[]).filter(x=>x.date>=start).reduce((a,x)=>a+Number(x.amount||0),0);
 const autoBalance=cap+income-expense;
 const balance=m.balanceMode==='manual'?Math.max(0,Number(m.manualBalance||0)):autoBalance;
 const plannedAllocation=Math.max(0,Number(m.survivalReserve||0))+Math.max(0,Number(m.emergencyReserve||0))+Math.max(0,Number(m.careerFund||0))+Math.max(0,Number(m.opportunityFund||0));
 const unallocated=cap-plannedAllocation;
 const dailyBurn=Math.max(0,Number(m.dailyBurn||0));
 const runway=dailyBurn?balance/dailyBurn:0;
 return {income,expense,balance,runway,cap,plannedAllocation,unallocated,dailyBurn,monthlyBurn:Math.max(0,Number(m.monthlyBurn||0))};
}

    <label>Starting Capital <input id="mCapital" type="number" min="0" step="1000" value="${Number(m.startingCapital||300000)}"></label>
    <label>Current Balance Mode <select id="mBalanceMode" onchange="toggleMentorBalanceMode()"><option value="auto" ${m.balanceMode!=='manual'?'selected':''}>Auto (Income − Expenses)</option><option value="manual" ${m.balanceMode==='manual'?'selected':''}>Manual</option></select></label>
    <label id="mManualBalanceWrap" style="display:${m.balanceMode==='manual'?'block':'none'}">Manual Current Balance <input id="mManualBalance" type="number" min="0" step="1000" value="${Number(m.manualBalance||0)}" placeholder="e.g. 46739"></label>
    <div class="full mentor-plan-date"><div class="label">Plan Start Date</div>${dateFieldMarkup('mStartDate',m.startDate||date,'Plan start date')}</div>
    <label>Monthly Essential Burn <input id="mBurn" type="number" min="0" step="1000" value="${Number(m.monthlyBurn||60000)}"></label>
    <label>Daily Burn <input id="mDailyBurn" type="number" min="0" step="100" value="${Number(m.dailyBurn||2000)}"></label>
    <label>Survival Reserve <input id="mSurvival" type="number" min="0" step="1000" value="${Number(m.survivalReserve||180000)}"></label>
    <label>Emergency Reserve <input id="mEmergency" type="number" min="0" step="1000" value="${Number(m.emergencyReserve||60000)}"></label>
    <label>Career / Income Fund <input id="mCareer" type="number" min="0" step="1000" value="${Number(m.careerFund||30000)}"></label>
    <label>Opportunity Fund <input id="mOpportunity" type="number" min="0" step="1000" value="${Number(m.opportunityFund||30000)}"></label>
   </div>
   <button class="primary" type="button" onclick="mentorSave()">💾 Save Capital Plan</button>
   <div class="kpi-grid" style="margin-top:12px"><div class="kpi-box"><div class="muted">Current Balance</div><div class="big">₹${Math.round(f.balance).toLocaleString('en-IN')}</div></div><div class="kpi-box"><div class="muted">Runway</div><div class="big">${f.runway.toFixed(1)} days</div></div><div class="kpi-box"><div class="muted">Income Since Start</div><div class="big">₹${Math.round(f.income).toLocaleString('en-IN')}</div></div><div class="kpi-box"><div class="muted">Expenses Since Start</div><div class="big">₹${Math.round(f.expense).toLocaleString('en-IN')}</div></div></div>
   <div class="kpi-grid" style="margin-top:10px"><div class="kpi-box"><div class="muted">Planned Allocation</div><div class="big">₹${Math.round(f.plannedAllocation).toLocaleString('en-IN')}</div><div class="meta">Reserves + funds</div></div><div class="kpi-box"><div class="muted">Unallocated Capital</div><div class="big">₹${Math.round(f.unallocated).toLocaleString('en-IN')}</div><div class="meta">Starting capital − allocation</div></div><div class="kpi-box"><div class="muted">Monthly Burn</div><div class="big">₹${Math.round(f.monthlyBurn).toLocaleString('en-IN')}</div></div><div class="kpi-box"><div class="muted">Daily Burn</div><div class="big">₹${Math.round(f.dailyBurn).toLocaleString('en-IN')}</div></div></div>
   <div style="margin-top:12px"><div class="${st[0]==='good'?'status-good':st[0]==='warn'?'status-warn':'status-bad'}">${st[1]}</div><div class="capital-bar" style="margin-top:6px"><i style="width:${f.cap>0?Math.max(0,Math.min(100,f.balance/f.cap*100)):0}%"></i></div><div class="meta" style="margin-top:6px">Capital plan: ₹${Math.round(f.cap).toLocaleString('en-IN')} · Allocation: ₹${Math.round(f.plannedAllocation).toLocaleString('en-IN')} · Remaining/unallocated: ₹${Math.round(f.unallocated).toLocaleString('en-IN')}</div></div>
  </div>
  <div class="card"><div class="section-title"><h2>🎯 Mission Tracker</h2><button class="secondary" type="button" onclick="mentorSave()">💾 Save Mission</button></div>
   <div class="mission-editor">${missions.map((x,i)=>`<div class="mission-row"><div class="mission-row-title"><span class="tag">Month ${i+1}</span></div><div class="mission-fields"><input id="mmMission${i+1}" value="${esc(x.mission||'')}" placeholder="Mission"><input id="mmTarget${i+1}" value="${esc(x.target||'')}" placeholder="Target, e.g. ₹10–30k"><input id="mmAction${i+1}" value="${esc(x.action||'')}" placeholder="Action / next step"><select id="mmStatus${i+1}"><option ${x.status==='Pending'?'selected':''}>Pending</option><option ${x.status==='Active'?'selected':''}>Active</option><option ${x.status==='Done'?'selected':''}>Done</option></select><input id="mmNote${i+1}" value="${esc(x.note||'')}" placeholder="Short note"></div></div>`).join('')}</div>
  </div>
 </div>
 <div class="card"><div class="between"><h2>📊 KPI Tracking — AD ${esc(date)} · BS ${esc(formatBsShort(date))}</h2><button class="secondary" type="button" onclick="mentorUseToday()">📅 Today</button></div><div class="muted">Selected Mentor Date पर data save होगा. Habit values उसी date से automatically आती हैं.</div>
 <div class="kpi-grid" style="margin-top:12px">${[['Applications','mkApplications','applications'],['Outreach','mkOutreach','outreach'],['Follow-ups','mkFollowups','followups'],['Contacts','mkContacts','contacts'],['Portfolio Outputs','mkPortfolio','portfolio'],['Earned ₹','mkEarned','earned'],['Exercise (Habit)','mkExercise','exercise',true],['Yoga (Habit)','mkYoga','yoga',true],['Meditation (Habit)','mkMeditation','meditation',true],['Learning min','mkLearning','learning'],['Family min','mkFamily','family'],['Sleep (Habit)','mkSleep','sleep',true]].map(([lab,id,key,auto])=>`<label class="kpi-box">${lab}${auto?'<span class="meta" style="display:block;margin-bottom:4px">Auto from Habits</span>':''}<input id="${id}" type="number" min="0" step="1" value="${Number(k[key]||0)}" ${auto?'readonly aria-readonly="true" title="Automatically calculated from Habits for this date"':''}></label>`).join('')}</div>
 <label style="display:block;margin-top:10px">Reflection / obstacle <textarea id="mkNotes" rows="3" placeholder="आज क्या बना, क्या कमाया, क्या सीखा, कहाँ गलती हुई?">${esc(k.notes||'')}</textarea></label>
 <div class="row" style="margin-top:10px"><button class="primary" type="button" onclick="mentorSave()">💾 Save KPI & Mentor Data</button><button class="secondary" type="button" onclick="delete data.mentorKpis[data.mentorSelectedDate||today()];save();renderMentor()">Reset Selected Day</button></div>
 </div>
 <div class="card mentor-quotes-card"><div class="between"><h2>📚 Mentor Principles / Quotes (${(data.mentorQuotes||[]).length})</h2><span class="meta">Dashboard पर भी automatically दिखेगा</span></div><div class="list" style="margin-top:10px">${(data.mentorQuotes||[]).map(x=>`<div class="item"><div class="between"><div style="min-width:0"><b>“${esc(x.text)}”</b><div class="meta">${esc(x.author||'Mentor')} · ${esc(x.category||'Motivation')}</div></div><button class="danger" type="button" onclick="deleteMentorQuote('${x.id}')">Delete</button></div></div>`).join('')}</div></div>
 <div class="card mentor-rules-card"><div class="between"><div><h2>🧭 Mentor Rules</h2><div class="meta">Rules अब editable हैं — strategy बदलने पर यहाँ से update करें. Changes इसी device पर तुरंत save होते हैं.</div></div><span class="tag">${(data.mentorRules||[]).length} Rules</span></div><div class="mentor-rules-editor">${(data.mentorRules||[]).map((r,i)=>`<div class="mentor-rule-row"><span class="tag">${i+1}</span><textarea class="mentor-rule-input" data-rule-id="${esc(r.id||'')}" rows="2" placeholder="Mentor rule लिखें...">${esc(r.text||'')}</textarea><button class="danger" type="button" onclick="deleteMentorRule('${esc(r.id||'')}')" title="Delete rule">Delete</button></div>`).join('')}</div><div class="row" style="margin-top:10px"><button class="primary" type="button" onclick="mentorSaveRules()">💾 Save Rules</button><button class="secondary" type="button" onclick="addMentorRule()">＋ Add Rule</button><button class="secondary" type="button" onclick="resetMentorRules()">↺ Reset Defaults</button></div></div>`;
}

const LIFEOS_CATEGORIES={
 personal:['👤 Personal','Self-care, habits, health and daily personal growth.','Health, routines, boundaries, self-development'],
 professional:['💼 Professional','Work, career, skills, projects and execution.','Career goals, projects, learning, work systems'],
 spiritual:['🕉 Spiritual','Inner peace, faith, reflection and purpose.','Prayer, meditation, gratitude, values'],
 economical:['💰 Economical','Money, savings, income and responsible resource planning.','Budget, savings, income ideas, financial priorities'],
 mental:['🧠 Mental','Clarity, emotional awareness and mental fitness.','Stress notes, focus, reflection, recovery'],
 social:['🤝 Social','Relationships, family, community and communication.','People to contact, relationship goals, contribution'],
 moral:['⚖️ Moral','Character, ethics, integrity and right action.','Principles, decisions, promises, accountability']
};
function categoryKey(id){return 'lifeos_category_'+id}
function getCategoryItems(id){try{return JSON.parse(localStorage.getItem(categoryKey(id))||'[]')}catch(e){return []}}
function saveCategoryItems(id,items){try{localStorage.setItem(categoryKey(id),JSON.stringify(items))}catch(e){}}
function renderCategory(id){
 const el=document.getElementById(id),meta=LIFEOS_CATEGORIES[id]; if(!el||!meta)return;
 const items=getCategoryItems(id);
 el.innerHTML=`<div class="hero"><div class="eyebrow">LIFE BALANCE</div><h2>${meta[0]}</h2><p>${meta[1]}</p></div><div class="two"><div class="card"><h2>＋ Add ${meta[0].replace(/^\S+\s/,'')} item</h2><div class="form"><input id="catTitle-${id}" placeholder="Title / priority"><textarea id="catText-${id}" placeholder="Write a thought, plan, habit, responsibility or next action..."></textarea><button class="primary" onclick="addCategoryItem('${id}')">Save Item</button></div></div><div class="card"><h2>Focus areas</h2><p class="muted">${meta[2]}</p><div class="list"><div class="item">Keep one clear next action.</div><div class="item">Review this area weekly.</div><div class="item">Avoid overloading the page with unnecessary effects.</div></div></div></div><div class="card" style="margin-top:14px"><div class="between"><h2>Saved items</h2><span class="tag">${items.length} items</span></div><div class="list">${items.length?items.map(x=>`<div class="item ${x.done?'done':''}"><div class="between"><label class="check"><input type="checkbox" ${x.done?'checked':''} onchange="toggleCategoryItem('${id}','${x.id}',this.checked)"><span><b>${esc(x.title)}</b><div class="meta">${esc(x.text||'')}</div></span></label><button class="danger" onclick="deleteCategoryItem('${id}','${x.id}')">Delete</button></div></div>`).join(''):'<div class="empty">अभी कोई item नहीं।</div>'}</div></div>`;
}
function addCategoryItem(id){const t=document.getElementById('catTitle-'+id),x=document.getElementById('catText-'+id);if(!t||!t.value.trim())return toast('Title लिखें');const a=getCategoryItems(id);a.unshift({id:uid(),title:t.value.trim(),text:x.value.trim(),done:false,createdAt:Date.now()});saveCategoryItems(id,a);renderCategory(id);toast('Saved')}
function toggleCategoryItem(id,itemId,done){const a=getCategoryItems(id),x=a.find(v=>v.id===itemId);if(x){x.done=done;saveCategoryItems(id,a);renderCategory(id)}}
function deleteCategoryItem(id,itemId){saveCategoryItems(id,getCategoryItems(id).filter(x=>x.id!==itemId));renderCategory(id)}
function renderSettings(){
 const el=document.getElementById('settings');if(!el)return;
 el.innerHTML=`<div class="hero"><div class="eyebrow">CONTROL CENTER</div><h2>⚙️ Settings</h2><p>Theme, backup, device connection and lightweight app controls.</p></div><div class="two"><div class="card"><h2>🎨 Appearance</h2><p class="muted">Readable light mode is default. Theme switch remains available in the sidebar.</p><button class="secondary" onclick="window.toggleAppearance();return false">🌗 Toggle Light / Dark</button></div><div class="card"><h2>💾 Backup & Export</h2><p class="muted">Document-friendly backups</p><div class="settings-backup-grid"><button class="primary" onclick="exportWord()">Word</button><button class="primary" onclick="exportExcel()">Excel</button><button class="primary" onclick="exportPDF()">PDF</button><button class="secondary" id="computerExportBtn" onclick="setupComputerExport()">🖥 Connect Computer</button></div><div class="meta" style="margin-top:10px">Computer connection saves daily LifeOS archive files into a folder you select (Chrome/Edge desktop).</div></div></div><div class="card" style="margin-top:14px"><h2>⚡ Performance</h2><p class="muted">Heavy glow, blur, animation and decorative layers are disabled in this final build for faster startup and clearer contrast on low-end devices.</p></div>`;
}

function updateComputerExportLabel(){
  const b=document.getElementById('computerExportBtn');
  if(!b)return;
  b.textContent=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent||'')?'📱 Transfer to Computer':'🖥 Connect Computer';
}

function render(){let id=document.querySelector('.section.active').id;if(id==='dashboard')renderDashboard();if(id==='mentor')renderMentor();if(id==='planner')renderPlanner();if(id==='tasks')renderTasks();if(id==='routine')renderRoutine();if(id==='notes')renderNotes();if(id==='journal')renderJournal();if(id==='habits')renderHabits();if(id==='expenses')renderExpenses();if(id==='review')renderReview();if(id==='achievements')renderAchievements();if(id==='goals')renderGoals();if(id==='focus')renderFocus();if(id==='reset')renderReset();if(LIFEOS_CATEGORIES[id])renderCategory(id);if(id==='settings')renderSettings();updateComputerExportLabel();restoreDrafts()}
if(new URLSearchParams(location.search).has('reset')) history.replaceState({},document.title,location.pathname);
const __localDate = new Date();
const __yyyy = __localDate.getFullYear();
const __mm = String(__localDate.getMonth()+1).padStart(2,'0');
const __dd = String(__localDate.getDate()).padStart(2,'0');
const __todayInput=document.getElementById('today'); if(__todayInput) __todayInput.value=`${__yyyy}-${__mm}-${__dd}`;
syncBsFromAd();
nav();show('dashboard');

// Keep below-the-fold images cheap; the brand logo stays eager for instant header paint.
document.querySelectorAll('img:not(.brand-logo)').forEach(img=>{img.loading='lazy';img.decoding='async'});


</script>
<script>
(function(){
  const syncCompactNav=()=>{
    const active=document.querySelector('.section.active');
    const id=active&&active.id;
    document.querySelectorAll('#mobileBottomNav button[data-section]').forEach(b=>{
      b.classList.toggle('active',b.dataset.section===id);
    });
  };
  const oldShow=window.show;
  if(typeof oldShow==='function'){
    window.show=function(){
      const r=oldShow.apply(this,arguments);
      requestAnimationFrame(syncCompactNav);
      return r;
    };
  }
  window.addEventListener('load',syncCompactNav);
})();
</script>
